<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>YouTube Video Search</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; line-height: 1.5; color: #222; max-width: 800px; }
    h1 { margin-bottom: 8px; }
    .muted { color: #666; font-size: 13px; }
    .row { margin: 12px 0; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .field label { font-weight: bold; display: block; margin-bottom: 4px; font-size: 13px; }
    input[type="text"] { padding: 10px; box-sizing: border-box; font-size: 14px; width: 420px; max-width: 100%; }
    input[type="number"] { padding: 10px; font-size: 14px; width: 90px; }
    button { padding: 10px 16px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .status { margin-top: 8px; font-size: 14px; color: #444; }
    .status.err { color: #b42318; }
    .status.ok { color: #1a7f37; }
    #urls { margin-top: 18px; font-family: monospace; font-size: 13px; white-space: pre-wrap; word-break: break-all; }
    #urls a { display: block; color: #1a0dab; text-decoration: none; padding: 2px 0; }
    #urls a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>YouTube Video Search</h1>
  <p class="muted">Search YouTube videos via <code>/api/search?urlOnly=1</code>.</p>

  <div class="row">
    <div class="field">
      <label for="query-input">Query</label>
      <input type="text" id="query-input" placeholder="e.g., lord of the rings" />
    </div>
    <div class="field">
      <label for="max-results-input">Max results</label>
      <input type="number" id="max-results-input" value="10" min="1" max="50" />
    </div>
    <div class="field">
      <button id="search-btn">Search</button>
    </div>
  </div>

  <div class="status" id="status-text"></div>

  <div id="urls"></div>

  <script>
    const API_BASE   = '';
    const queryInput = document.getElementById('query-input');
    const maxResultsInput = document.getElementById('max-results-input');
    const searchBtn  = document.getElementById('search-btn');
    const statusText = document.getElementById('status-text');
    const urlsDiv    = document.getElementById('urls');

    function setStatus(text, cls) {
      statusText.textContent = text;
      statusText.className = 'status' + (cls ? ' ' + cls : '');
    }

    async function runSearch() {
      const q = queryInput.value.trim();
      const maxResults = Math.min(Math.max(parseInt(maxResultsInput.value, 10) || 10, 1), 50);
      if (!q) { setStatus('Enter a search query first.', 'err'); return; }

      searchBtn.disabled = true;
      searchBtn.textContent = 'Searching…';
      urlsDiv.innerHTML = '';
      setStatus(`Searching for "${q}"…`);

      try {
        const url = `${API_BASE}/api/search?q=${encodeURIComponent(q)}&maxResults=${maxResults}&urlOnly=1`;
        const res = await fetch(url);
        const body = await res.json();
        if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);

        const urls = Array.isArray(body) ? body : [];
        if (urls.length === 0) {
          setStatus('No results found.', 'err');
          return;
        }
        urlsDiv.innerHTML = urls.map(u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`).join('');
        setStatus(`Found ${urls.length} video${urls.length === 1 ? '' : 's'}.`, 'ok');
      } catch (e) {
        setStatus(`Error: ${e.message}`, 'err');
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Search';
      }
    }

    queryInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runSearch(); });
    searchBtn.addEventListener('click', runSearch);
  </script>
</body>
</html>
